[package]
name = "redink"
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
authors = ["J/A <archer884@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A spellchecker for prose — a TUI for humans, a JSON CLI for agents"
repository = "https://github.com/archer884/redink"
homepage = "https://github.com/archer884/redink"
documentation = "https://docs.rs/redink"
readme = "README.md"
keywords = ["spellcheck", "spelling", "markdown", "tui", "dictionary"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
spellbook = { version = "0.4", default-features = false, features = ["default-hasher"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
ignore = "0.4"
rayon = "1.12.0"

[profile.release]
lto = "thin"
