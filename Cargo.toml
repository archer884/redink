[package]
name = "redink"
version = "0.1.0"
edition = "2024"

[dependencies]
spellbook = { version = "0.4", default-features = false, features = ["default-hasher"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
ratatui = "0.29"
crossterm = "0.28"
ignore = "0.4"

[profile.release]
lto = "thin"
